  <body>
    <script id="ledger-data" type="application/json">{"project":"vcr","staleAfterDays":14,"records":[{"id":"VCR-001","title":"Initial implementation","type":"improvement","severity":"low","status":"closed","foundBy":"the repository's first commit","opened":"2026-08-16","resolved":"2026-08-17","stint":"2026-08-17 session: name the cassette on the base URL","evidence":{"commits":["9db7450a4a38585a64ef3f5ef761bfcacd53680d"],"integrated":[],"verified":"At that commit, go test ./... passes for every package. The smoke suite replays 3/3 scenarios with the real Claude Code 2.1.232, Codex 0.145.0 and OpenCode 1.18.11 in 5.95s, each reporting upstream calls 0 and misses 0."},"resolution":"Record and replay ship: the proxy, the cassette format, the command tree and a live agent suite covering all three clients across the three surfaces cs-vcr routes.","details":"Record and replay the traffic between AI coding agents and LLM providers, so no API key ever enters a sandbox and CI runs the whole agent loop for $0.","notes":[],"links":[]},{"id":"VCR-002","title":"Reaching a second cassette needs a clients block, so a scenario cannot be added by base URL alone","type":"improvement","severity":"med","status":"closed","foundBy":"user report (jsd): selecting a cassette by URL pattern \"wasn't convenient at all\"","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 session: name the cassette on the base URL","evidence":{"commits":["bb90fcb6eb71a2008b3ed3d345fb13e0550e8147"],"integrated":[],"verified":"`make check` passes with and without -race, and both documentation linters pass. `make test-integration` replays every fixture with the real agents, while each is driven at /c/\u003cscenario>. The proxy is started with no --cassette at all, so the prefix is the only thing that could have selected the cassette. By hand against a fake provider: two scenarios recorded through one cs-vcr with nothing declared, both replaying with upstream calls 0 while that provider was still listening. A name the store does not hold gets 404 unknown_cassette, and /c/..%2F..%2Fetc gets 400."},"resolution":"A /c/\u003cname> prefix names the cassette directly. The clients block is gone; the provider pin it carried is now a cassette_provider map keyed by cassette name, and the name is validated because it becomes a directory. Replay opens a cassette that must already exist, so a base URL with a typo in it is reported rather than answered with a session that misses every request.","details":"A `/c/\u003cname>` prefix on the base URL tells cs-vcr which cassette a request belongs to, but the prefix reaches a cassette only through a `clients:` entry in the configuration file. Each entry holds a label, a path prefix and a cassette. Adding one scenario means editing two things that have to agree: the agent's base URL and cs-vcr's own config.\n\nThat cost lands hardest where the mechanism is most useful. A build that wants a cassette per test has to declare all of them in the config file before any can run. A test added later fails with `unknown_client` until somebody remembers the second edit.\n\nThe prefix already carries the name. Nothing else in the entry is needed to find the cassette: the label only appears in logs, and the `cassette:` field restates what the prefix said. So the design is to let the prefix name the cassette directly, with nothing declaring it. An entry carried one thing a prefix cannot, a pinned provider, and that becomes a map keyed by cassette name.\n\nA request header was weighed against this and measured first. All three agents can send one from an environment variable, and `ANTHROPIC_CUSTOM_HEADERS`, `env_http_headers` and OpenCode's `{env:...}` interpolation were each confirmed on the wire. The prefix won on two counts. It costs one setting rather than two, and it rides on requests that carry no headers at all. Claude Code opens a connection with a bare `HEAD /api/hello` preconnect built from a method and nothing else.","notes":[{"date":"2026-08-17","text":"cs-vcr config \u003cagent> came out of this: where the prefix goes relative to the /v1 a client appends differs per client, and that rule had no single place to live. It prints a runnable command per agent."}],"links":[]},{"id":"VCR-003","title":"--cassette absorbs a request whose base URL lost its prefix, hiding the mistake it was meant to catch","type":"defect","severity":"med","status":"closed","foundBy":"user report (jsd): \"Why do we still need the --cassette option at all?\"","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 session: drop the session cassette","evidence":{"commits":["cf50ce4"],"integrated":[],"verified":"`cs-vcr replay --help` no longer lists the --cassette flag. A POST to http://127.0.0.1:8080/v1/messages with no /c/ prefix returns 404 no_cassette: \"the base URL must end in /c/\u003cname> to say which cassette this request belongs to\". SPEC R1a now states the refusal and carries the corrected measurement: Claude Code's HEAD /api/hello preconnect builds its URL from ANTHROPIC_BASE_URL and so carries the prefix."},"resolution":null,"details":"A `/c/\u003cname>` prefix on the base URL names the cassette a request belongs to. `--cassette` names one for requests that carry no prefix, and that is the whole of what it now does.\n\nIt is a hazard rather than a convenience. Before the prefix mapped to a cassette directly, a request matching no client was refused with `unknown_client`. A base URL missing its prefix could not look like it worked while its traffic landed somewhere else. `--cassette` reinstates exactly that failure: forget the prefix and the run records into whatever the session happens to name. With no session cassette either, a recording session proxies everything and records nothing, and only `recorded 0` in the summary says so.\n\nThe justification written into SPEC R1a is measurably wrong. It claims the fallback catches requests that cannot carry the prefix, naming Claude Code's `HEAD /api/hello` preconnect, which sets no headers at all. The preconnect builds its URL from `ANTHROPIC_BASE_URL`, so it carries the prefix like everything else: pointing Claude Code 2.1.232 at `http://127.0.0.1:9501/c/probe` produces `HEAD /c/probe/api/hello`. That was measured, not inferred.\n\nSo the option should go, and a request that names no cassette should be refused and told what its base URL should have ended in.","notes":[{"date":"2026-08-17","text":"Reviewing the startup checks alongside this found the same rule applied unevenly. A `cassette_provider` pin naming an unconfigured provider was refused at startup, while `default_provider` carrying the same typo was not, and neither was a `base_url` that will not parse. Both matter, and `default_provider` most. It takes the paths cs-vcr does not model, which is what a client's startup probe hits. A typo there is a 502 on the first request a session makes."},{"date":"2026-08-17","text":"Replay resolved an upstream before the replay branch, so a session could fail with no_provider for a provider it could never have called. Goal 1 asks a recorded session to replay with no provider reachable and no credential configured; reachable was structural, configured was true only because the default configuration names two providers."},{"date":"2026-08-17","text":"Two documentation defects came up while bringing the docs across. CS_VCR_HOME relocates the config file and was documented nowhere. `record --help` claimed the command serves what the cassette already holds, which is the opposite of what SPEC R3 requires of a recording session."},{"date":"2026-08-17","text":"Closed from the outside during a documentation walkthrough. The flag was already gone and the refusal already in place; the record had been left in flight."}],"links":["VCR-002"]},{"id":"VCR-004","title":"The documented pod fails on an SELinux host, exiting 139 with no log line","type":"defect","severity":"med","status":"closed","foundBy":"session agent, following README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["d4a2325"],"integrated":[],"verified":"Played the stock spec from a world-traversable directory: pod Degraded, container exit 139, no logs. After `chcon -t container_file_t -l s0 bin/cs-vcr` the same spec runs, and a POST of cassettes/claude-code-subscription/req/0001.json through the published port returned HTTP 200."},"resolution":null,"details":"INSTALL.md's container section is two commands: `make build-go` then `podman kube play deploy/vcr.yaml`. On Fedora with SELinux enforcing the pod reports `Degraded`, the container exits 139, and `podman logs` is empty, so nothing says why.\n\n`podman kube play` gives a hostPath **directory** a shared SELinux label and leaves a hostPath naming a **file** alone. This host was measured before and after playing the spec:\n\n```\nbin/cs-vcr   user_tmp_t        (unchanged)\ncassettes    container_file_t  (relabelled)\n```\n\nSo the container cannot execute the binary it was mounted. Relabelling the binary alone fixes it, and the pod then serves a recorded step. A plain `chcon -t container_file_t` is not always enough: it keeps whatever MCS category a previous container left on the file, and `-l s0` clears it.\n\nThe pod spec's header already warns that the store has to be readable by uid 65532, which is the same class of host detail.","notes":[],"links":[]},{"id":"VCR-005","title":"The completion verb works and no document mentions it","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, following README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["a7436a6"],"integrated":[],"verified":"`cs-vcr completion bash | head -1` prints the bash completion header. MANUAL.md now carries the verb in its synopsis and a section with the two ways to install the script."},"resolution":null,"details":"`cs-vcr completion bash|zsh|fish|powershell` writes a completion script to stdout. MANUAL.md is \"every command, option, file and diagnostic\" by the README's doc map, and named every verb but this one, so the only way to find it was `--help`.\n\nThe sandbox repository documents its equivalent in both its manual and its install page.","notes":[],"links":[]},{"id":"VCR-006","title":"The first install route points at a releases page with nothing on it","type":"defect","severity":"med","status":"open","foundBy":"session agent, following README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":null,"stint":"2026-08-17 documentation walkthrough","evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"INSTALL.md §1 leads with \"Download a release\": fetch the archive and `checksums.txt`, verify the checksum, then the cosign signature. No v* tag has been pushed and `.github/workflows/release.yml` fires on a tag, so the releases page is empty.\n\nA first-time reader takes the first route offered and finds nothing to download.\n\nCutting the first tag makes the whole section true. Until then the page says so.","notes":[{"date":"2026-08-17","text":"INSTALL.md now says plainly that no version has been tagged, which is the sentence the tracer repository already carries. This record stays open until a tag exists."}],"links":[]},{"id":"VCR-007","title":"make check needs two tools no document named, and the ledger gate a third","type":"defect","severity":"med","status":"closed","foundBy":"session agent, following README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["42a66b3"],"integrated":[],"verified":"`env PATH=/usr/bin:/bin:/usr/local/go/bin make lint` exited 2 with \"golangci-lint is not installed\". CONTRIBUTING.md now names all three tools, pinning golangci-lint to v2.12.2, the version .github/workflows/ci.yml installs."},"resolution":null,"details":"CONTRIBUTING.md tells a contributor to run `make check` before pushing. The target is `check: fmt-check vet lint deadcode test test-race docs oss`, and `lint` and `deadcode` shell out to `golangci-lint` and `deadcode`. Neither comes with Go, and no document named either. The CI workflow installs both, under the comment \"the two tools make check shells out to\".\n\nThe ledger doctrine has the same gap. `AGENTS.md` routes an agent to `ledger/AGENTS.md`, which says to run `cs-ledger render && cs-ledger check`, and nothing said where that binary comes from. The answer sat in the Makefile's error message, which only a failed run prints.","notes":[],"links":[]},{"id":"VCR-008","title":"A cassette from another build answered 500, so clients retried instead of stopping","type":"defect","severity":"high","status":"closed","foundBy":"session agent, investigating a report that `make test-smoke` hangs","opened":"2026-08-20","resolved":"2026-08-20","stint":"2026-08-20 test-smoke hang investigation","evidence":{"commits":["efe088a"],"integrated":[],"verified":"A `replay` session over the committed cassettes answered `curl` with 400 and the `cassette_unusable` body, naming ruleset v6 against v10, where it had answered 500. `go test ./... -race -count=1` passes, including TestReplayNamesACassetteItCannotRead, which now asserts 400."},"resolution":null,"details":"`make test-smoke` ran for its full ten-minute timeout and said nothing about why. Every process sat at 0% CPU, so it read as a deadlock rather than as a refusal.\n\nThe cause was a refusal the client kept retrying. The committed cassettes were recorded under normalization ruleset v6 and this build had moved to v10, so `Cassette.Usable` refused each one. The proxy reported that as HTTP 500. Stainless-generated SDKs retry a 5xx, so Claude Code backed off and asked again, doubling the wait each time: 0.5s, 1.1s, 2.4s, 4.4s, 8.4s, 16.5s, 36.8s.\n\nThe refusal message named both ruleset versions and said to record the cassette again. Nobody saw it, because the client swallowed the 500 and the run looked like a hang.\n\nThe miss path already answered 400 for this exact reason, and rule R31 in SPEC.md recorded why. The path that opens a cassette never applied it. The `cassette_corrupt` reply had the same defect and moved with it.","notes":[],"links":[]},{"id":"VCR-009","title":"The agent suite ran to its timeout instead of naming a fixture it cannot replay","type":"defect","severity":"med","status":"closed","foundBy":"session agent, investigating a report that `make test-smoke` hangs","opened":"2026-08-20","resolved":"2026-08-20","stint":"2026-08-20 test-smoke hang investigation","evidence":{"commits":["abbf6d6"],"integrated":[],"verified":"`CS_VCR_AGENTS=1 go test ./test/agents -run 'TestReplayFixtures/(claude-code-subscription|codex-api-key|opencode-fireworks)'` failed in 0.54s, naming ruleset v6 against v10 for all three scenarios. The same command previously ran to the ten-minute timeout."},"resolution":null,"details":"TestReplayFixtures starts a proxy and a real agent for each fixture. A cassette recorded under an older normalization ruleset is refused per request rather than at startup. The suite had no signal until the agent gave up or the test timed out.\n\nThe suite already guards the other half of the same problem. It compares the recorded prompt against the current one and fails with a message telling the reader to run `make fixtures`. The ruleset version had no equivalent check, although `cs-vcr cassette verify` exists and reports exactly that.\n\nThe new check is a failure rather than a skip, on every host. An agent that is not installed is a gap in what one machine can cover. A fixture recorded under a ruleset the build no longer speaks is committed and wrong for everybody.","notes":[],"links":[]},{"id":"VCR-010","title":"Every committed cassette is at ruleset v6 while the build is at v10, so none replay","type":"defect","severity":"high","status":"closed","foundBy":"session agent, investigating a report that `make test-smoke` hangs","opened":"2026-08-20","resolved":"2026-08-20","stint":"2026-08-20 test-smoke hang investigation","evidence":{"commits":["ddad5a3"],"integrated":[],"verified":"`make fixtures` recorded all eight scenarios and passed, 107s. `make test-integration` replays all eight with fabricated credentials in 18.0s, and `make test-smoke` passes in 6.1s where it previously ran to its ten-minute timeout. Every cassette.yaml now reads normalize_version: 10. A scan of every committed cassette file found none of the three API keys, neither login's tokens, the account id, the home path or the username."},"resolution":null,"details":"The eight cassettes under `cassettes/` all record `normalize_version: 6`. This build's ruleset is v10. A cassette whose ruleset is not the build's is refused, so no fixture replays, and `make test-smoke` and `make test-integration` both fail.\n\nFour commits moved the ruleset without re-recording. `3da5d83` took it to v7, `3c98639` to v8, `85f574b` to v9 and `ceb0594` to v10. CONTRIBUTING.md requires a ruleset change to bump the version and re-record in the same pull request.\n\nThe remedy is `make fixtures`, which records one real session per scenario. It needs a Claude Pro or Max login, an Anthropic key, an OpenAI key and a Fireworks key, and it spends money. That is why it was not done in the session that found this.\n\nThe two defects closed beside this one changed how the failure presents. It is now reported in under a second, naming both versions and the remedy. Neither of them re-records anything, so this stays open until the fixtures are recorded again.","notes":[{"date":"2026-08-20","text":"Recorded against Claude Code 2.1.232, Codex 0.145.0 and OpenCode 1.18.11, which are the versions the manifest now pins for replay. The scrub took three ChatGPT account ids out of the codex-chatgpt responses. The recording run replayed the cassette after scrubbing it, which proves the scrub did not break the match."}],"links":["VCR-008","VCR-009"]},{"id":"VCR-011","title":"A mistyped cassette name may reach the operator as an unknown model error","type":"defect","severity":"low","status":"open","foundBy":"session agent, while changing the status an unusable cassette answers","opened":"2026-08-20","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"An `unknown_cassette` reply answers 404. Rule R31 in SPEC.md records that a 404 on `/v1/messages` is how the Anthropic API reports an unknown model. One cassette miss consequently reached an operator as advice to check their model access. The `unknown_cassette` path returns the same status on the same endpoint, so it is open to the same misreading.\n\nThis is reasoned from that rule rather than reproduced. No run has been observed in which a client renamed a mistyped cassette prefix.\n\nThe status also carries a distinction the code argues for deliberately. A cassette that is absent and one that will not open are different mistakes, and the reply is meant to say which. Any change has to keep that distinction while avoiding the renaming, which is why this was left alone rather than decided in passing.","notes":[],"links":[]},{"id":"VCR-012","title":"Codex 0.148.0 gives every input element a per-run id, so no Codex fixture could be recorded","type":"defect","severity":"high","status":"closed","foundBy":"session agent, re-recording the Codex fixtures after the host's codex auto-updated","opened":"2026-08-20","resolved":"2026-08-20","stint":"2026-08-20 test-smoke hang investigation","evidence":{"commits":["954b829"],"integrated":[],"verified":"`make fixtures` records all eight scenarios and passes. `make test-smoke` and `make test-integration` each replay all eight green, 18.1s and 17.7s. TestTheDefaultStripTakesCodexMessageIdsAndLeavesToolCallIds asserts both halves: two runs of one question normalize alike, and two different call_id values still do not."},"resolution":null,"details":"Codex 0.148.0 attaches an `id` to every element of `input`, minted fresh per run: `msg_01a02023-b134-76d0-b0fe-06cf1a749449` one run and `msg_01a02023-cfca-7a61-9081-2e183aeb3d62` the next.\n\nNo rule in the ruleset covered it, so recording a Codex session became impossible. `make fixtures` replays a cassette before it keeps it, and that replay compared a recording against the very run that had produced it and missed on the first request. The failure was not subtle, but it looked like a matching bug rather than a new field.\n\nThe field is stripped rather than declared volatile. A volatile path reports every difference it allows, and this one differs on every message of every request, so the session summary would fill with observations about a nonce.\n\nThe accompanying test pins the other half of the line. A tool call's `call_id` sits on the exact side of it. A rule broad enough to take both ids would let a replay agree with a session that called a different tool.","notes":[],"links":[]},{"id":"VCR-013","title":"A recording that fails because the model skipped its tool is reported as a sandbox fault","type":"defect","severity":"low","status":"open","foundBy":"session agent, when one scenario failed during a re-record and passed on a retry","opened":"2026-08-20","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"Recording `opencode-fireworks` failed once because the model answered \"done\" without ever creating hello.txt. It had not called the write tool. Re-running that one scenario recorded and replayed cleanly, so nothing was wrong with the code or the cassette.\n\nThe suite prints a hint when a replay served every step and the work still did not happen. It reads `The agent could not run its own tool — on Linux that is usually a sandbox denied an unprivileged user namespace`. That names one cause, and there are two. A model that chose not to call its tool produces the same evidence, and the hint sends the reader to check bubblewrap and namespaces instead of running it again.\n\nTwo things would help, and they are independent. The hint could name both causes and say that a retry separates them. And `make fixtures` could say that a scenario which failed this way is worth re-running before it is investigated. A recording run is not reliably idempotent when a model decides what to do.","notes":[],"links":[]},{"id":"VCR-014","title":"Ruleset v12 landed without the fixtures, so every cassette was refused and CI went red","type":"defect","severity":"high","status":"closed","foundBy":"session agent, investigating a report that the GitHub CI build is broken","opened":"2026-08-21","resolved":"2026-08-21","stint":"2026-08-21 CI failure investigation","evidence":{"commits":["fc9e26f"],"integrated":[],"verified":"`./bin/cs-vcr cassette verify` reports all eight cassettes ok and exits 0, where it exited 4 naming 21 stale entries. `make test-smoke` replays all eight fixtures against Claude Code 2.1.232, Codex 0.148.0 and OpenCode 1.18.11 in 17.6s, all PASS. `./bin/cs-vcr cassette scrub` reports all eight clean, and `make check` exits 0."},"resolution":null,"details":"`d3b0e62` added `\u003cskills_instructions>` to the drop list and took the ruleset to v12 without re-recording. The eight committed cassettes all still read `normalize_version: 11`, and a cassette whose ruleset is not the build's is refused by name, so no fixture replayed.\n\nTwo CI jobs failed on it. `cassette verify` exited 4 reporting 21 stale entries across all eight cassettes, and `integration` failed every subtest of `TestReplayFixtures` with the same version mismatch.\n\nThis is the second time the ruleset has moved without the fixtures following it; VCR-010 was the same defect across four commits. CONTRIBUTING requires the bump and the re-recording in one pull request, and nothing enforces that locally before a push.\n\nThe remedy taken was a renormalization rather than a re-recording. Every committed request body is the canonical form the recorder hashed. Normalizing each one under v11 produced a byte-identical body, with a hash matching its index line. Ruleset v12 differs from v11 only by dropping a whole list item, so normalizing the committed bodies under v12 produces what a recording under v12 would have written. Four Codex requests lost their skills list, 2826 bytes each; the other seventeen entries were unchanged.","notes":[{"date":"2026-08-21","text":"`make fixtures` was not an option on the host that fixed this. It has an OpenAI and a Fireworks key but no Anthropic key, and the Claude Pro/Max and ChatGPT scenarios need interactive logins. A partial recording run would have left at least three cassettes at v11 and CI still red."},{"date":"2026-09-09","text":"The evidence sha is corrected here. This record cited `d313eb4` from the commit that filed it, and no such commit is in this repository, so the sha came from a history rewritten before it was pushed. The commit that did the work is `fc9e26f`, which takes every `cassette.yaml` off `normalize_version: 11`, and it is the only commit in the range that does. `3fe5281`, which filed and closed this record, touches `ledger/` alone. The cause this record names, `d3b0e62`, was always resolvable and is unchanged."}],"links":["VCR-010"]},{"id":"VCR-015","title":"A value only the response names is recorded verbatim, so replay hands out the recording host's identity","type":"defect","severity":"high","status":"closed","foundBy":"session agent, tracing a cs-campaign smoke failure to the cassette that caused it","opened":"2026-08-25","resolved":"2026-08-25","stint":"2026-08-25 cs-campaign replay miss investigation","evidence":{"commits":["2334f3d"],"integrated":[],"verified":"`go test ./internal/proxy/ -count=1`: TestAnIdentifierOnlyTheResponseNamesIsBlanked and TestAnOldRecordingDoesNotServeItsHostsIdentifier PASS, and each fails with its half of the change reverted. `make check` passes. `make test-smoke` replays all eight fixtures green in 17.6s with no scenario skipped. Against the cs-campaign response that caused this, replaying the committed cassette and replaying a re-recording of it serve identical bytes, 3024 characters. Both name \u003cDEV:2> where the recorded next request expects it."},"resolution":null,"details":"R16 says every capture match is blanked. A response is blanked only with the values the request it answers captured, so a match the request never made survives into the cassette as it was.\n\nA model names such a value whenever it repeats something a tool result put in front of it, or invents one outright. The pattern is what declares the value run-specific, and no rule reads it once it is in a response alone.\n\nThis was measured on cs-campaign's opencode-fireworks cassette. `csrocfw-orchestrator/resp/0033.sse` holds `dev-97a3d923` and `csrocfw-97a3d923`, sandboxes that existed only on the recording host, next to a correctly blanked `\u003cDEV:1>` in the same sentence. The other four scenarios carry no such value, which is why they replay reliably and this one does not.\n\nThe agent acts on what it is served. In that campaign it wrote the sentence to a summary file and read the file back on the next turn. The request then carried one identifier from this run and one from the recording. Two distinct values where the recording had one shifts every later placeholder number, and the run misses on a request whose text is otherwise identical.\n\nReproduced by TestAnIdentifierOnlyTheResponseNamesIsBlanked: recording a response that names an id the request did not stores it verbatim, and replay serves it to the client.","notes":[{"date":"2026-08-25","text":"The value was not the recording host's own sandbox. Instead, dev misreported its branch, and the orchestrator wrote down both the claim and the correction. The id was one the model invented rather than one it was given."}],"links":[]},{"id":"VCR-016","title":"The provider is guessed from the request shape, so a config key may only be called anthropic or openai","type":"improvement","severity":"med","status":"closed","opened":"2026-08-27","resolved":"2026-08-27","stint":"2026-08-27 provider-in-the-URL","foundBy":"user report (host): \"Determining the target provider from the request shape (e.g. /messages -> anthropic) is very fragile. Can we instead adopt a URL convention like /c/\u003cprovider-name>/\u003ccassette-name>\"","evidence":{"commits":["d6b5cdf"],"integrated":[],"verified":"make check with an empty CS_VCR_HOME: prose, refs, oss and surface all report 0 errors, and every package passes. make test-smoke: TestReplayFixtures PASS, all 8 scenarios, 18.9s. That smoke run is the load-bearing one. It replays every committed cassette through the three real agents under the new prefix, with nothing re-recorded, which shows the extra segment is stripped before a request is keyed."},"resolution":"A base URL now carries /c/\u003cprovider>/\u003ccassette>. The provider is a free key into `providers`, `default_provider` and `cassette_provider` are gone, and `classify` is gone with them. The surface is still read from the path, and replay still reads no provider configuration.","details":"`classify` maps a surface to a hardcoded provider name. `/messages` becomes `anthropic`, and `/responses` and `/chat/completions` become `openai`. A provider entry is reachable by path only if it is called one of those two names. Every other name needs a workaround, and this repository's own scenario matrix carries both of them.\n\n`opencode-fireworks` pins its cassette. `test/agents/scenario.go` says why: \"Fireworks is not a provider cs-vcr routes to by path, every OpenAI-shaped request looks the same\". `claude-code-fireworks` avoids the pin by naming a Fireworks endpoint `anthropic`, so its config key states a vendor its `base_url` contradicts.\n\nThe two workarounds sit on a third mechanism. `default_provider` takes whatever neither the path nor the Anthropic-specific headers identified. Absorbing is what rule R1a refuses for the cassette, on the grounds that \"a default to absorb it into would make a mistyped base URL look like it worked\". A request that lands on the wrong provider is forwarded there with the client's credential attached, and recorded as though it were the answer.\n\nThe request already carries one name the operator chose, which is the cassette prefix. Carrying the provider beside it as `/c/\u003cprovider>/\u003ccassette>` states what the client is pointed at. That drops `default_provider`, `cassette_provider` and `classify` together. The surface is unaffected. It is read from the path because that is what keys the body, and replay reads it while reading no provider configuration at all.","notes":[{"date":"2026-08-27","text":"Two follow-ups this left alone. The claude-code-fireworks scenario can now name its provider entry `fireworks` instead of `anthropic`, which needs a re-record because the entry name is recorded as cassette metadata. And a config file carrying default_provider or cassette_provider now fails at startup under rule R43, which is the migration this change asks of anyone upgrading."},{"date":"2026-08-27","text":"This was followed up in review. The claude-code-fireworks scenario now names its provider entry `fireworks`, so the entry no longer states a vendor its base_url contradicts. The cassettes still carry `anthropic` as recorded metadata until they are recorded again. The printer's provider is an argument rather than a per-client default. The code names the prefix one word throughout: `Prefix`, `RoutePrefix`, `ErrNoPrefix`, and the `no_prefix` and `bad_prefix` replies."},{"date":"2026-08-27","text":"The shipped provider set grew to four: anthropic, openai, chatgpt and fireworks, each at its own endpoint. Naming the provider in the base URL is what allows the third. `openai` and `chatgpt` are one vendor at two endpoints, and a request cannot be told which it meant. A deployment reaching any of the four now writes no configuration file. `cs-vcr config codex` prints the block each endpoint actually needs: a version segment and a key for one, neither for the other."},{"date":"2026-08-27","text":"The cassettes were recorded again, so the metadata matches the entries that serve them. `claude-code-fireworks` records `fireworks` and `codex-chatgpt` records `chatgpt`, including the GET /models probe that opens a Codex session. Every step is a 200, and `make ci` replays all eight."}],"links":[]},{"id":"VCR-017","title":"A partial normalize block silently drops the rules cs-vcr ships","type":"defect","severity":"high","status":"closed","foundBy":"session agent, wiring cs-vcr into the cs-sandbox agent test tiers","opened":"2026-08-28","resolved":"2026-08-28","stint":"2026-08-28 cs-sandbox agent replay tiers","evidence":{"commits":["dd707d5"],"integrated":[],"verified":"go test ./internal/config/ -run 'Extend|Replacing' -count=1: PASS, 3 tests. And measured on the built binary: a file declaring `normalize.extend.replace` with one rule takes `cs-vcr config` to `v12 (7 strip, 1 query, 11 replace)`. The same rule under `normalize.replace` takes it to 1 and prints `replaces the shipped replace (use normalize.extend to add instead)`. The committed fixtures all replay under `make test-smoke`, so no cassette key moved."},"resolution":"`normalize.extend` appends to the shipped rules for each field, after them. The names directly under `normalize` still replace, because a deployment may mean that, and a session now reports which fields it replaced at startup and in `cs-vcr config`. `calibrate` proposes the `extend` form, and the manual's rule-writing advice uses it.","details":"`Load` decodes a config file into `Default()`, and a YAML sequence replaces the slice it decodes into rather than appending to it. So `normalize.volatile: [my.path]` leaves the ruleset with one volatile path instead of five.\n\nMeasured on the pinned build. A file declaring a single `replace` rule took `cs-vcr config` from `v12 (7 strip, 1 query, 10 replace)` to `v12 (7 strip, 1 query, 1 replace)`.\n\nIt matters because the manual tells people to do exactly this. \"Making a real agent run replayable\" says to declare a path under `normalize.volatile`, and `calibrate` prints a `normalize.volatile` block to paste. Following either instruction drops the four shipped volatile rules, which are what let a multi-turn session replay at all. Every tool result becomes part of the key, and the first request carrying anything the world answered misses.\n\nThe damage is silent twice over. Nothing reports that a shipped rule was dropped, and the cassette still records `normalize_version: 12`, so `cassette verify` passes on a cassette keyed under rules no other deployment applies.\n\nA caller who wants to add one rule has to restate every shipped rule for that field, by copying them out of `internal/config/config.go`. Two projects already do: cs-campaign restates two captures, and the cs-sandbox agent tiers restate the same two.","notes":[],"links":[]},{"id":"VCR-018","title":"A pinned model defeats the auxiliary-turn relaxation","type":"defect","severity":"med","status":"closed","foundBy":"session agent, replaying the cs-sandbox agent matrix","opened":"2026-08-28","resolved":"2026-08-28","stint":"2026-08-28 cs-sandbox agent replay tiers","evidence":{"commits":["dd707d5"],"integrated":[],"verified":"go test ./internal/cassette/ -run 'Auxiliary|Shaped' -count=1: PASS, 5 tests, including TestAnAuxiliaryTurnIsRecognizedOnAPinnedModel and TestASessionOfOnlyShapedTurnsAbsorbsNothing. make test-smoke: 8 of 8 committed fixtures still replay."},"resolution":"A recorded step counts as bookkeeping when the cassette holds work to tell it apart from. Either signal will do: a step on another model, or one that is not shaped like bookkeeping. The guard the model check provided is unchanged, because a cassette whose every entry is a single tool-free message still has nothing to distinguish. SPEC R8a states it.","details":"`auxiliaryEntry` recognizes a recorded step as bookkeeping only when it is on a model the cassette does not otherwise use. Claude Code's title generation usually lands on haiku, so that holds for a session which lets the client choose.\n\nIt stops holding the moment a harness pins the model, and a harness that wants a replayable cassette pins the model. `claude -p --model X` puts the title call on X too, the cassette has one model throughout, and no step is recognized as auxiliary. The relaxation is then off in the one case it was written for.\n\nThis was measured across the cs-sandbox agent matrix. The shared Claude cell, whose title call landed on haiku, replayed 2 of 2 requests clean. The lent cell, identical but for the credential, put the title call on the pinned model and missed one request of three, stably, across runs.\n\nThe model is the wrong axis. What separates bookkeeping from work in that cassette is the tool list: the main turn carries 21 tools and the title call carries none. `shaped` already reads the tool list, and the guard the model check provides can be had from it.","notes":[],"links":[]},{"id":"VCR-019","title":"record tunnels a client to a provider that replay refuses","type":"defect","severity":"med","status":"closed","foundBy":"session agent, reading tunnelRefusal while wiring the cs-sandbox agent tiers","opened":"2026-08-28","resolved":"2026-08-28","stint":"2026-08-28 cs-sandbox agent replay tiers","evidence":{"commits":["dd707d5"],"integrated":[],"verified":"go test ./internal/proxy/ -run Connect -count=1: PASS, including TestConnectRefusesProvidersInBothModes, which asserts api.openai.com is refused while recording as well as while replaying."},"resolution":"`tunnelRefusal` refuses the configured providers in both modes. Replay needed it to keep its own promise. Recording needs it because a tunnel is piped rather than stored, so a model call arriving as CONNECT reaches the provider without being recorded. SPEC R32 covers both, and the manual names the four phone-home hosts it had been reporting as three.","details":"`tunnelRefusal` refuses the configured providers only when the session is offline, so `replay` refuses `api.openai.com` and `api.fireworks.ai` while `record` carries a client straight to them.\n\nThat breaks the property every cassette rests on: the two halves have to ask the same question. A side call refused during replay and answered during recording changes the prompt that follows it, and the miss surfaces far from the cause.\n\nIt is also a hole in recording on its own terms. A CONNECT to a provider is a model call that went around the base URL, so it reaches the provider without passing through the recorder. The cassette does not contain it, and the replay cannot serve it. Refusing it while recording is what makes the recording complete.\n\nThe manual has the same gap, from the other side. \"The calls a base URL does not govern\" says the tunnel refuses three hosts and names them. The build refuses four: `models.opencode.ai` joined the list and the prose did not. Neither the prose nor the list mentions that replay refuses the providers as well.","notes":[],"links":[]},{"id":"VCR-020","title":"The pod manifest shows a base URL that the build would refuse","type":"defect","severity":"low","status":"closed","foundBy":"session agent, reading deploy/vcr.yaml","opened":"2026-08-28","resolved":"2026-08-28","stint":"2026-08-28 cs-sandbox agent replay tiers","evidence":{"commits":["dd707d5"],"integrated":[],"verified":"grep for a one-segment /c/ form across the tracked yaml and markdown: no hits left. make refs: 0 errors."},"resolution":"The comment shows `/c/anthropic/build` and says both segments are required, naming `bad_prefix` as what a one-segment URL gets.","details":"`deploy/vcr.yaml` tells the reader to end a base URL in `/c/\u003cname>`, and shows `ANTHROPIC_BASE_URL=http://127.0.0.1:8080/c/build`.\n\nThe prefix has carried two segments since the provider became part of it. A URL with one segment is refused as `bad_prefix`. A reader who copies the line gets a pod that serves nothing, and an error naming a rule the file never mentioned.\n\nIt is the only place the old one-segment form survives.","notes":[],"links":["VCR-016"]},{"id":"VCR-021","title":"Claude Code dates its web-search tool, so every cassette misses on the first of the month","type":"defect","severity":"high","status":"closed","foundBy":"cs-sandbox replay tier, 2026-09-01: four of fourteen cells failed against cassettes recorded 2026-08-28","opened":"2026-09-01","resolved":"2026-09-01","stint":"2026-09-01 web-search month","evidence":{"commits":["64760a0"],"integrated":[],"verified":"go test ./internal/config/ -run TestDefaultNormalizesTheMonthInAToolDescription -count=1: PASS. The same test fails with the rule removed. cs-sandbox's agents_replay tier passes 14 of 14 cells against a cs-vcr built from this tree, serving 29 requests and missing none. Under v12, that tier reports a miss on every claude cell."},"resolution":"The shipped ruleset blanks the month to `\u003cMONTH>`, which takes the ruleset to v13. The eight committed fixtures were renormalized rather than re-recorded. None carries the sentence, so every body and hash round-tripped byte for byte, and only `normalize_version` moved. SPEC.md section 13 lists the substitution beside the three date spellings.","details":"Claude Code writes the current month into the description of its web-search tool:\n\n```\n- The current month is August 2026 — use this when searching for recent information.\n```\n\nA tool description is hashed like any other part of the body. On the first of the month, every request in a Claude Code session stops matching.\n\nThe three shipped date rules do not reach it. Each is written for a day the client renders as one, in the prompt. This month is spelled by name, inside a tool.\n\nThe cs-sandbox replay tier measured it on 2026-09-01, against cassettes recorded on 2026-08-28. All four of its claude cells failed. Its ten codex and opencode cells passed, because Claude Code alone dates a tool definition. The miss lands on the request carrying the question. The agent has no answer to print, so the run reports a model that would not reply.\n\nThis repository's own fixtures did not catch it. Its Claude Code scenarios restrict the toolset to Read and Write. No web-search tool reaches the body, so the smoke tier stayed green through the turn of the month.\n\nCalibrate proposes `tools[].description` as a volatile path. That works, and it is too broad. It takes the prose of every tool out of the key, when one sentence in one description is what the world decides.","notes":[],"links":[]},{"id":"VCR-022","title":"A client that hangs up is recorded as a 502 from the provider","type":"defect","severity":"med","status":"closed","foundBy":"session agent, reading the claude-login cassettes in cs-sandbox while fixing VCR-021","opened":"2026-09-01","resolved":"2026-09-01","stint":"2026-09-01 web-search month","evidence":{"commits":["b512919"],"integrated":[],"verified":"go test ./internal/proxy/ -run TestAnErrorForAClientThatLeftIsNotRecorded -count=1: PASS. Without the guard it fails with `recorded = 1`, over the same three log lines the cs-sandbox recording produced. Its two neighbours still pass: a hang-up mid-stream records what the client received, and a genuine transient is still recorded and flagged."},"resolution":"The tap now marks a status the reverse proxy's error handler wrote, and `record` declines to store one when the client had already gone. Both halves are needed. Without the client check, a genuine upstream failure the client did receive would stop being recorded. Without the marker, an interrupted stream would be dropped instead of kept. SPEC.md R28a carves the case out of R28, and the manual lists the warning.","details":"When a client disconnects mid-request, `ReverseProxy` calls its `ErrorHandler`. That handler writes a 502 `upstream_error` through the tap, and `record` stores it as a step of the session.\n\nThe 502 is cs-vcr's own. No provider sent it, and the client never saw it, because the client had already gone. The recording log says as much:\n\n```\nlevel=ERROR msg=\"upstream failed\" err=\"context canceled\"\nlevel=WARN msg=\"recording a transient failure as a step of the session\" status=502 cassette=claude-login-lent\nlevel=INFO msg=recorded seq=2 cassette=claude-login-lent streaming=false events=0\n```\n\nReplay is then less faithful than the recording. The step is served to a client that is still alive and reading, so it receives an error the recorded session never delivered. R31 says why that matters: a Stainless SDK retries a 5xx, and the cassette holds no second copy of a request that was only asked once.\n\nTwo of cs-sandbox's committed fixtures carry one. `claude-login-lent` and `claude-login-shared` each end on a 502 whose body reads `{\"error\":{\"type\":\"upstream_error\",\"source\":\"cs-vcr\"}}`. Claude Code prints its answer and exits while the session-title call is still in flight, so the race is reliable there rather than occasional. One recording run caught `opencode-fireworks-lent` the same way.\n\nIt is latent today. Those cassettes replay with every step served and nothing missed, because the agent exits before it can retry. A client that read the step and retried would miss.\n\nThe transient-failure branch is written for a provider having a bad moment, and that reasoning does not reach this case. `record` already computes `clientGone` from the request context, which is what separates the two. The neighbouring case is the `t.status == 0` branch, which declines to record when nothing reached the client at all.","notes":[],"links":["VCR-021"]},{"id":"VCR-023","title":"A straggling probe rewound the replay window behind the session","type":"defect","severity":"high","status":"closed","foundBy":"session agent, chasing a codex replay that took 363s where its peers took 70s, 2026-09-09","opened":"2026-09-09","resolved":"2026-09-09","stint":"2026-09-09 replay window anchor","evidence":{"commits":["09fa539"],"integrated":[],"verified":"TestAStragglerDoesNotRewindTheWindow fails without the change and passes with it. It needs TWO unclaimed probes at the front. Serving a lone straggler lets the cursor run past everything already served, and the cursor is itself a frontier, so one probe hides the defect."},"resolution":"The window anchor is a high-water mark. Serving a step only ever moves it forward, so a straggler landing behind the session leaves the window where the session is.","details":"SPEC 5.1 says the scan reaches at most lookahead steps past THE FURTHEST STEP ALREADY SERVED, and says plainly why. The code set that mark to whichever step was served most recently in time, which is a different thing whenever a step is served out of order.\n\nR6 is what makes them differ. It serves an already-served step again for a client that probes more often on one run than another. It says outright that the extra ask can arrive after the session has moved past the step answering it. Such a straggler is behind everything served, so recording it as the furthest point drags the anchor backwards.\n\nMeasured on a codex-subscription cassette that opens with four GET /models. The replay made three, so the cursor parked on the fourth while the session's whole first turn was served on the window. The third probe then arrived late and dropped the anchor from step 18 to step 3. The next real turn sat at step 22, comfortably inside a window measured from 18 and far outside one measured from 3, so it missed. The codex client then backed off for four minutes before the session realigned.\n\nThe cost was a replay taking 363s where every other scenario took about 70s. That is a tier which contacts no provider and should be bounded by nothing but the harness. It was invisible as a defect: the run passed, the campaign reached its verdict, and the only symptom was the clock.\n\nRe-recording did not help and could not. The recording faithfully captures probes the replay does not repeat, which is the condition the window exists to absorb.","notes":[],"links":[]},{"id":"VCR-024","title":"config opencode prints a provider key that OpenCode does not use for Fireworks","type":"defect","severity":"med","status":"closed","foundBy":"session agent working in the simple-tools-demo repository, which runs a three member campaign at the pinned build of 2026-09-17, while pointing a pinned opencode 1.18.31 at a cassette","opened":"2026-09-19","resolved":"2026-09-21","stint":null,"evidence":{"commits":["32bcd75"],"integrated":[],"verified":"`go test ./internal/cli/ -run TestConfigPrintsTheProviderItWasGiven -count=1` passes. It checks three things about the output of `config opencode --provider fireworks`. The opencode.json block is keyed `fireworks-ai`, and its base URL still routes through `/c/fireworks/`. The run line names the model as `fireworks-ai/\u003cmodel>`. Neither `\"fireworks\":` nor `--model fireworks/` appears anywhere in the output. All three fail on the renderer as it was."},"resolution":null,"details":"`cs-vcr config opencode --cassette hello --provider fireworks` prints this block, and a run line that names the model as `fireworks/\u003cmodel>`:\n\n```\n\"provider\": {\n  \"fireworks\": {\"options\": {\"baseURL\": \"http://127.0.0.1:8080/c/fireworks/hello/v1\"}}\n}\n```\n\nOpenCode's own id for that provider is `fireworks-ai`. `opencode models` lists `fireworks-ai/accounts/fireworks/models/...` and nothing under `fireworks`. A `baseURL` set under the key `fireworks` therefore configures a provider the run never uses, and the agent calls Fireworks at its default address.\n\nThe damage is contained. With the proxy variables set as the same output advises, the call arrives as a `CONNECT` and cs-vcr refuses it with `cs-vcr does not tunnel to the fireworks provider`. The summary shows `requests 0` and `tunnel refused 3`, so nothing is spent and nothing is recorded. A reader who followed the printed block exactly still ends with a run that cannot work, and an error that does not mention the key.\n\nWith the key written as `fireworks-ai` and nothing else changed, the same run records and replays three steps.\n\nThe cs-vcr provider name and the client's provider id are different things, and `config` prints the first where the client needs the second. The Fireworks entry is the one where the two differ.\n\nTo reproduce, follow the printed `OPENCODE_CONFIG_CONTENT` line against `cs-vcr replay`, with `--model fireworks-ai/accounts/fireworks/models/kimi-k2p7-code`.","notes":[{"date":"2026-09-21","text":"The test that covered this case asserted the defect: it required the block to be keyed `fireworks`. It now requires the key OpenCode uses. A consumer that printed the same advice can drop it once it pins a cs-vcr with this fix."}],"links":[]},{"id":"VCR-025","title":"The scrubber cannot be told a username, because it refuses a value under twelve characters","type":"improvement","severity":"med","status":"closed","foundBy":"session agent working in the tour repository, which records and replays a three member campaign through cs-vcr, while building a gate that refuses a recording holding anything of the recorder","opened":"2026-09-19","resolved":"2026-09-20","stint":"2026-09-20 scrubber identity and addresses","evidence":{"commits":["0d453cc"],"integrated":[],"verified":"go test ./internal/cassette/ -run TestScrub -count=20 and go test ./internal/cli/ -run TestScrub -count=20: PASS. The reproduction in this record, run against bin/cs-vcr, gave `found 4 env:WHO` and exit status 4, where it had said `WHO was not looked for`. `cs-vcr cassette scrub --recorder` over the committed cassettes, with a real identity, reported every one clean."},"resolution":"A named value under 12 characters is matched as a whole word, and `--recorder` names the caller without any variable being exported.","details":"With `--from-env VAR`, the `cs-vcr cassette scrub` command is told to find the literal value of a variable. A value under twelve characters is refused with `was not looked for: under 12 characters, so it would match ordinary text`. The scrubber carries on and reports the cassette clean of it.\n\nThe reason is sound, and it leaves a gap. A sandbox gives its guest the username of whoever launched it. So the recorder's username is the personal value most likely to be in a cassette. Usernames are short. In one recorded campaign the username was in 51 files of a cassette that the scrubber reported `clean`. It appeared as `home/\u003cname>/hello-app` with no leading slash, and as `/tmp/\u003cname>-verify.js`, which an agent had made up. A capture rule written for `/home/\u003cname>` matches neither.\n\nThe scrubber also has no way to learn the recorder's git name or hostname unless they are passed the same way. Both reach a cassette when an agent prints its git configuration, which the sandbox record SBX-043 describes.\n\nMatching a short value as a whole word would avoid the ordinary-text problem the limit guards against. A flag that adds the recorder's own username, git name, git address and hostname to the search would make the common case one command.\n\nThe tour's gate does this outside cs-vcr today, with `grep -rlwF` over the cassette for each of those values.\n\nTo reproduce, add `drwxr-xr-x 2 alovelace alovelace 4096 .` to a request in any cassette, then run `WHO=alovelace cs-vcr cassette scrub \u003cname> --from-env WHO`.","notes":[{"date":"2026-09-20","text":"Both requests shipped, with two limits the record did not ask for. A value under 3 characters is still refused. So is a word the API itself uses, such as `user`, `system` or `root`, however it was named. Every request holds `\"role\":\"user\"`, so a recorder whose login is `user` would have `--force` rewrite the protocol. Both refusals are reported, as the 12 character one was."},{"date":"2026-09-20","text":"The filer should know the names. The flag is `--recorder`, and it looks for the username, the hostname, and git `user.name` and `user.email`. Findings are reported as `recorder:username` and so on, and `--force` writes `\u003cUSER>`, `\u003cHOST>`, `\u003cNAME>` and `\u003cEMAIL>`. A short value matches on `\\\\b` boundaries, which treats `_` as part of a word, as `grep -w` does. SPEC rule R50a holds the contract."}],"links":["VCR-024"]},{"id":"VCR-026","title":"The scrubber refuses a reserved documentation address, and nothing lets one through","type":"improvement","severity":"low","status":"closed","foundBy":"session agent working in the tour repository, which records and replays a three member campaign through cs-vcr, while gating a recording on the scrubber's exit status","opened":"2026-09-19","resolved":"2026-09-20","stint":"2026-09-20 scrubber identity and addresses","evidence":{"commits":["0d453cc"],"integrated":[],"verified":"go test ./internal/cassette/ -run TestScrubLetsReservedAndAllowedAddressesThrough -count=20 and go test ./internal/cli/ -run TestScrubPassesAddressesThatBelongToNobody -count=20: PASS. Against bin/cs-vcr, a request holding one address under example.com, one under .invalid and one under another domain gave `found 1 email`, and `clean` with exit status 0 once `--allow-email` named that domain."},"resolution":"A reserved address is not a finding, and `--allow-email` lets a gate pass the public addresses a real session prints.","details":"`cs-vcr cassette scrub` reports every mail address it finds, and exits 4 while any is left. It has no allow-list. So it refuses a cassette for `developer@example.com`, which an agent invented for a commit. It refuses one as readily for any public address that a tool prints.\n\n`example.com`, `example.org` and `example.net` are reserved for documentation, and an address there belongs to nobody. The `.invalid` domain already passes: `agent@example.invalid` is not reported.\n\nThe cost is that a gate built on the exit status cannot pass a real agent session. Two recordings of one campaign were refused this way. The first held the invented address above. The second held two addresses in the orchestrator's tool output, and they were never identified, because the gate of the time deleted what it refused. The model chooses afresh each time, so the next recording can hold another. The only remedy today is a `capture` rule that blanks every address in the cassette, which the tour now uses. That works, and it has a side effect. An address the model writes into a file, where the request never held it, is replayed as a placeholder.\n\nLetting the reserved domains through, and an allow-list for the rest, would let a gate tell a leak from a harmless address. cs-lint has `emailAllow` for the same reason.\n\nTo reproduce, add `see maintainer@example.com` to a request in any cassette and run `cs-vcr cassette scrub \u003cname>`.","notes":[{"date":"2026-09-20","text":"One statement in this record did not hold when measured. `agent@example.invalid` was reported like any other address: the reproduction, with that address added, gave `found 3 email`. The committed fixtures only look clean of it because recording scrubs them with `--force`. The `.invalid` names now pass with the other reserved ones."},{"date":"2026-09-20","text":"One difference from what was asked, for the filer. The allow-list is a flag, `--allow-email`, and not a config key like `emailAllow` in cs-lint. Everything else `scrub` is told arrives as a flag, and a gate is a script that can carry one. A value is a whole address, or `@domain`, which also covers every name under that domain. What passes with no flag is `example.com`, `example.org`, `example.net` and their subdomains, and any name ending in `.example`, `.invalid`, `.test` or `.localhost`. SPEC rule R50b holds the contract."}],"links":["VCR-025"]},{"id":"VCR-027","title":"A request for a cassette's bare address counts as a miss, so a health probe from outside fails a replay that served every recorded call","type":"defect","severity":"high","status":"closed","foundBy":"session agent replaying a multi-member campaign through cs-vcr, several replays at a time on one shared host","opened":"2026-09-20","resolved":"2026-09-20","stint":"2026-09-20 probe and miss dump","evidence":{"commits":["06ffa3c"],"integrated":[],"verified":"go test ./internal/proxy/ -run \"TestAProbe|TestAPostToTheBareAddress\" -count=20 and go test ./internal/cli/ -run TestAProbeDoesNotFailAReplay -count=20: PASS. Before the fix the replay test answered 400 cassette_miss and the record test logged `the probe reached the provider` with 2 entries. Against bin/cs-vcr on the committed cassettes, two curl probes gave 200, and the summary read `misses 0`, `probes 2`, exit status 0."},"resolution":"cs-vcr answers a bodiless request for a bare cassette address itself, in both kinds of session, before selection and before forwarding. It counts a probe and nothing else.","details":"**What happened.** A campaign of several agents was replayed through `cs-vcr replay`. Each agent's base address was the proxy's address for its own cassette, of the form `/c/\u003cprovider>/\u003ccassette>`. Somebody on the host ran `cs-sandbox doctor`, which checks that each credential lender reaches its upstream by asking for that bare address. For each agent that was up, the proxy logged a `cassette miss` with `target=/` and the reason `this run asked for / instead`. The summary then showed `misses` and `rejected` equal to the number of probes, and `requests` larger than `replayed` by the same number. The process then gave exit status 4. Every recorded call had been served, in order.\n\n**Why it matters.** A miss means that the client asked something the recording does not hold. This request did not come from the client, and it is not a call to any provider surface. The probe does not move the cassette's position, which is right, so the only harm is the count and the exit status. A person who looks at the machine while a replay runs fails it. A consumer can work around this by subtracting the misses whose target is `/`, and that is a rule each consumer has to discover. SBX-048 asks for the probe to change on its side.\n\n**What is asked for.** Answer a request for `/` under a known cassette without counting a miss, and count it apart, as `probes` for example. Rule R6 already serves a client's repeated `GET /models` probe again, and VCR-023 settled how a late one is placed. This is the same idea for a request that matches no provider route at all.\n\n**The record mode twin is not tested.** `serve_command.go` says that anything unrecognised on the proxied port is forwarded to a provider. A probe that arrives during `cs-vcr record` may therefore reach the provider, or be written into the cassette as a step that no replay will ever make. Somebody should check that before a recording made on a shared host is trusted.\n\n**How to reproduce.** Start `cs-vcr replay --cassettes DIR`, run `curl http://127.0.0.1:PORT/c/\u003cprovider>/\u003ccassette>`, and stop the proxy. The summary shows `misses 1` and the exit status is 4.","notes":[{"date":"2026-09-20","text":"The record mode twin is real. A test written before the fix showed the probe reaching the provider, and the cassette gaining `GET /` as step 1. `record` now answers the probe itself, and does not open the cassette to do it, so a probe cannot create one."},{"date":"2026-09-20","text":"What shipped, for the filer. `GET` or `HEAD` on the bare address answers 200 with `{\"cassette\",\"mode\",\"source\"}`, and is counted on a `probes` summary line that is left out of `requests`. The fix has two limits that the record did not ask for. A probe of a cassette that `replay` does not hold still answers 404 `unknown_cassette`, so a checker finds a mistyped name. A `POST` to the bare address is still a miss, because that is a client whose base URL lost its path. SPEC rule R21 holds the contract."}],"links":["VCR-023","VCR-028"]},{"id":"VCR-028","title":"A dumped miss can be an empty file, and the summary's `rejected` line is named nowhere in the manual","type":"defect","severity":"low","status":"closed","foundBy":"session agent replaying a multi-member campaign through cs-vcr, several replays at a time on one shared host","opened":"2026-09-20","resolved":"2026-09-20","stint":"2026-09-20 probe and miss dump","evidence":{"commits":["5f21a45"],"integrated":[],"verified":"go test ./internal/proxy/ -run TestADumpedMiss -count=20 and go test ./internal/cli/ -run TestCalibrateReadsOnlyTheDumpedBodies -count=20: PASS, and both failed before the change. The dump test sends Authorization and X-Api-Key and asserts neither value reaches the file. `cs-vcr manual | grep -c rejected` returns 3, and returned 0 before."},"resolution":"Each dumped miss has a `.request` file naming the method, the target and who sent it. MANUAL.md has a section on the summary that says every miss is also a rejection, and what else `rejected` counts.","details":"**The empty dump.** With `--dump-misses`, the proxy logged `missed request written` with a file name for each miss that VCR-027 describes. Each of those files was 0 bytes long. The request was a GET with no body, so there was no body to write, but the log line says that a request was written. `cs-vcr calibrate` has nothing to read in such a file. A dump that held the method, the target and the headers would have named the cause at once. As it was, three separate readers each had to find it in the proxy log.\n\n**The `rejected` line.** The summary that `cs-vcr` prints when it stops has a `rejected` count. It moved with `misses` in every run seen. `MANUAL.md` does not hold the word. A first-time reader could not tell whether `rejected 3` was a second fault or the same one.\n\n**What is asked for.** Write the request line and the headers into every dumped miss, and keep the body as it is now. Say in the manual what `rejected` counts and how it differs from `misses`.\n\n**How to reproduce.** Run the steps in VCR-027 with `--dump-misses ./misses`, then run `ls -l ./misses` and search the output of `cs-vcr manual` for `rejected`.","notes":[{"date":"2026-09-20","text":"One difference from what was asked, for the filer. The record asks for the request line and the headers in every dumped miss. The request line is written, and only three headers: `User-Agent`, `Content-Type` and `Content-Length`. Request headers carry the credential, SPEC rule R29 keeps them out of a cassette, and a miss directory sits in the same checkout. `User-Agent` is the header that would have named `curl` or the doctor command here."},{"date":"2026-09-20","text":"The fix differs in a second way. The line is written to `\u003cstep>.request`, and the body in `\u003cstep>.json` is unchanged. `diff` against the cassette and `cs-vcr calibrate` both read `\u003cstep>.json` as a bare body, so adding lines to it would break both. `calibrate` now reads only the `.json` files. SPEC rule R37a holds the contract."}],"links":["VCR-027"]},{"id":"VCR-029","title":"A picture inside a request is matched byte for byte, so an agent that shows the model a screenshot misses on the next run","type":"improvement","severity":"med","status":"closed","foundBy":"session agent replaying a multi-member campaign through cs-vcr, several replays at a time on one shared host","opened":"2026-09-20","resolved":"2026-09-20","stint":"2026-09-20 image payloads","evidence":{"commits":["37b62fd","65ce8c1"],"integrated":[],"verified":"go test ./internal/proxy/ -run TestAChangedPictureIsServedAndReported: 7 shapes PASS, and all 7 answered 400 before the rules. On each shape, a request with a changed question beside an unchanged picture still misses. With the pinned agents on the PATH, `make ci` exits 0 and its live tier passes all 8 scenarios against the fixtures recorded under v14. `cs-vcr cassette scrub --recorder` reports all 8 clean."},"resolution":"cs-vcr ships a volatile path for an inline picture, document, file or audio payload on each surface it knows. A changed payload is served and counted as drift, and everything beside it stays exact.","details":"**What happened.** An agent in a recorded campaign takes a screenshot of a web page and shows it to the model. The picture travels inside a request, as `messages[].content[].image_url.url` holding base64 data. On a busy host the second rendering differed by three bytes out of about fifteen thousand, and the replay missed at that step twice in a row. `cs-vcr calibrate` named the path from the real miss, and declaring it under `normalize.extend.volatile` cured it.\n\n**Why it matters.** `cs-vcr` already matches loosely on what a tool printed, because that is an observation of the world and not a decision. A picture a tool took is the same kind of thing. It is only compared exactly because it sits in a field that the shipped rules do not know. Every agent with a browser or a vision tool will meet this, and each author will have to find it through a miss. A rule written for one path covers one path. A picture in a tool result, or in another provider's content block, would miss again.\n\n**What is asked for.** Treat an inline image or other binary payload as a volatile observation in the rules `cs-vcr` ships, for each surface it knows. The OpenAI form is `image_url` with a `data:` address, and the Anthropic form is an `image` block with a base64 `source`. Say so in the manual beside the text on changed tool output.\n\n**How to reproduce.** Record a session in which the agent sends a screenshot to the model. Replay it on a machine under other load, with `--dump-misses`, and run `cs-vcr calibrate` on the result.","notes":[{"date":"2026-09-20","text":"The rules are written and tested on the branch `image-volatile`, and the record stays open. CONTRIBUTING.md asks for a ruleset change to bump `normalize.version` and re-record every committed fixture in the same change. That recording needs three API keys and two subscription logins, and has not been run."},{"date":"2026-09-20","text":"What the branch ships differs from the request in one way. The record asks for a `data:` address to be tolerated. A volatile rule is a path, and SPEC rule R11 forbids inferring volatility from a value. So the OpenAI paths `messages[].content[].image_url.url` and `input[].content[].image_url` also tolerate a changed remote address, and report it as drift. The Anthropic path is `messages[].content[].source.data`, which leaves a `url` source exact."},{"date":"2026-09-20","text":"The branch covers more than pictures, as the record's words `other binary payload` allow. It names Anthropic `document` blocks, OpenAI chat `file` and `input_audio` parts, and OpenAI responses `input_file` parts. A picture inside a tool result needed nothing, because the shipped tool result paths already cover it. The text beside a picture stays exact, and a test holds that on all seven shapes."},{"date":"2026-09-20","text":"The bump and the recording are done, so the first note above is history. The ruleset is v14, and all eight fixtures were re-recorded with the agent versions already pinned, so `fixtures.json` changed only in its dates and two step counts. This build refuses a cassette recorded under v13 until it is recorded again. The change alters no stored byte, and the version moved anyway, because two builds that disagree about which requests are equivalent must not share a number."},{"date":"2026-09-20","text":"The recording found two defects in the live suite, both fixed first. OpenCode listed the developer's own Claude Code skills in its prompt, which is the record VCR-032. A recording of the Codex subscription scenario could not be kept, which is the record VCR-033."}],"links":["VCR-017"]},{"id":"VCR-030","title":"SPEC.md uses the rule numbers R30 to R33 twice, so a reference to one of them names two rules","type":"defect","severity":"low","status":"open","foundBy":"session agent, while looking for a free rule number in SPEC.md for the probe rule R21","opened":"2026-09-20","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`SPEC.md` numbers its requirements so that code and records can cite them. R30, R31, R32 and R33 each appear twice. Section 6.1 on tunnelling uses them for the `CONNECT` rules. Sections 7 and 8 use them again, for response headers, the 400 status, refusing an unnamed cassette, and exit status 4.\n\nA comment in `internal/proxy/proxy.go` cites R31, and the manual and the ledger cite R33. A reader cannot tell which rule is meant without reading both.\n\nRenumbering the tunnelling rules is the smaller change, because fewer places cite them. Every citation in the code, the docs and the ledger has to move with them.\n\nTo reproduce, run `grep -o '\\*\\*R[0-9]*[a-z]*\\.\\*\\*' SPEC.md | sort | uniq -d`.","notes":[],"links":[]},{"id":"VCR-031","title":"A second `make ci` in a row fails its coverage check on a host whose live agent scenarios all skip","type":"defect","severity":"low","status":"open","foundBy":"session agent, running `make ci` on two branches in a row while fixing VCR-027 through VCR-029","opened":"2026-09-20","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`make ci` runs the live agent tier near its end, and that tier writes `.coverage/integration`. On a host whose installed agents are not the versions in `test/agents/fixtures.json`, every scenario skips, so that directory holds a run that reached no package.\n\nThe next `make ci` starts with `make check`, whose coverage check reads every tier directory it finds. It then fails with `internal/proxy is no longer reached by the integration tier`. Nothing in the tree changed between the two runs.\n\nThe message sends the reader to look for a test that stopped running. The cause is a directory left by the run before. Deleting `.coverage` makes the next run pass, and the one after it fails again.\n\nTo reproduce, install an agent version other than the pinned one, then run `rm -rf .coverage && make ci && make ci`. The first run exits 0 and the second exits 2.\n\nA tier in which every scenario skipped could be left out of the check, or `make check` could clear the tiers it does not run.","notes":[],"links":[]},{"id":"VCR-032","title":"OpenCode puts the developer's own Claude Code skills into the prompt of every live scenario, by name and by home path","type":"defect","severity":"high","status":"closed","foundBy":"session agent, running the live replay tier with the pinned agents before re-recording the fixtures for VCR-029","opened":"2026-09-20","resolved":"2026-09-20","stint":"2026-09-20 image payloads","evidence":{"commits":["37a6222"],"integrated":[],"verified":"With claude 2.1.245, codex 0.149.1 and opencode 1.18.22 on the PATH, `CS_VCR_AGENTS=1 CS_VCR_AGENTS_STRICT=1 go test ./test/agents -run TestReplayFixtures -count=1` on a host with skills under ~/.claude/skills. Before the change the three opencode scenarios failed at step 2 and the other five passed. After it all 8 passed, against fixtures recorded on another host."},"resolution":"The three scenarios set `OPENCODE_DISABLE_CLAUDE_CODE` and `OPENCODE_DISABLE_EXTERNAL_SKILLS`, so the agent does not look for the files at all.","details":"The live agent suite gives each agent a fresh `HOME`, so that nothing of the developer's reaches the prompt. OpenCode gets past it. It reads Claude Code's skills as its own, and it finds them by walking up from its working directory. The workspace is deliberately not a git repository, so nothing stops the walk. It sits in the developer's cache directory, which is under their real home, so the walk reaches `~/.claude/skills`.\n\nOn a host that has skills there, every one is listed in OpenCode's system prompt, with a `\u003clocation>` that holds the developer's home path. The three OpenCode scenarios then miss at step 2, with `input[0].content` differing. The committed fixtures list one built-in skill, because the host that recorded them had none of its own.\n\nReplaying is the mild half. A recording made on such a host would commit the developer's skill list and login name to a public repository, and would replay nowhere else, CI included. The scrubber finds neither, because a skill name and a path are not shapes it knows.\n\nTo reproduce, put any skill under `~/.claude/skills`, install opencode 1.18.22, and run `CS_VCR_AGENTS=1 CS_VCR_AGENTS_STRICT=1 go test ./test/agents -run TestReplayFixtures/opencode`.\n\nThe same walk could find an `AGENTS.md` or an `.opencode` directory above the workspace. That is not covered here, and moving the workspace out from under the home directory would close it.","notes":[],"links":["VCR-029"]},{"id":"VCR-033","title":"A fresh recording of the Codex subscription scenario cannot be kept, because its replay asks for the model list fewer times","type":"defect","severity":"med","status":"closed","foundBy":"session agent, re-recording the fixtures under ruleset v14 for VCR-029","opened":"2026-09-20","resolved":"2026-09-20","stint":"2026-09-20 image payloads","evidence":{"commits":["4742af1"],"integrated":[],"verified":"With codex 0.149.1, `CS_VCR_AGENTS_RECORD=1 CS_VCR_AGENTS_STRICT=1 go test ./test/agents -run 'TestRecordFixtures/codex-chatgpt$'` failed twice with `recorded 6 steps and replayed 3` and then `replayed 4`. After the change it passed and logged `served 4 of the 6 steps recorded`. `TestReplayFixtures` then passed all 8 scenarios, strictly, with no provider key in the environment."},"resolution":"The keep check fails a recording whose replay missed, fetched, or left the work undone, which `runScenario` asserts. It no longer fails one whose replay served fewer steps, and it logs the two counts.","details":"`TestRecordFixtures` replays each new recording before it keeps it, and failed unless the replay served exactly as many steps as were recorded. `TestReplayFixtures`, which CI runs, says the opposite in a comment. Fewer steps is not a failure there, because a client decides how often to ask for its model list.\n\nCodex 0.149.1 asks for `GET /models` four times while recording against the ChatGPT backend, and once or twice against a cassette, on every run. The cassette answers at once, so the first ask fills the cache before the others are sent. Held to equality, the `codex-chatgpt` scenario could not be recorded at all, however often it was tried. Each try spends a real session.\n\nThe unserved steps are harmless in replay. They sit inside the look-ahead window, and SPEC rule R6 covers the opposite case of a probe asked more often.","notes":[],"links":["VCR-029"]},{"id":"VCR-034","title":"The record summary does not say that the cassette it kept holds provider refusals","type":"improvement","severity":"low","status":"open","foundBy":"session agent, maintainer of a consumer of this tool, reading a recording made while a provider was throttling","opened":"2026-09-21","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"**What is there.** `record` keeps every response as a step of the session, refusals included. A throttle or a server error gets one warning in the log as it passes. A rejected credential gets none, because a 401 is not a status a client retries. The closing summary counts requests, recordings and upstream calls, and it has no line for refusals. The exit status is 0.\n\n**Why it matters.** Keeping the refusal is right, since a cassette holds the session as it happened. The gap is that nobody is told at the end. A cassette that holds a throttle replays it faithfully, the client retries as it did before, and the replay ends green. The recording looks healthy until somebody reads it. A cassette made on a provider's bad day then becomes the
