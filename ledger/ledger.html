fixture every later run is judged against.\n\n**How to reproduce.** Record a session against an upstream that answers one request with a 429 and the retry with a 200. Read the summary.\n\n**What would help.** Add a summary line that counts the kept refusals by status, shown only when the count is above zero. A flag that makes such a recording exit non-zero would let a recording script refuse it. What is recorded should stay as it is.","notes":[],"links":[]},{"id":"VCR-035","title":"The live tier's skip reason quotes the host's agent version, so it changes whenever an agent updates","type":"defect","severity":"low","status":"closed","foundBy":"deps-maintenance pilot2 campaign, from the qa seat's baseline of `make ci` (agents/qa/output/baseline.json, note on vcr)","opened":"2026-09-22","resolved":"2026-09-22","stint":"pilot2-tier3","evidence":{"commits":["078ec20"],"integrated":[],"verified":"At 078ec20, `go test ./test/agents/ -run 'ReplaySkip|NewerVersion' -count=1` passes 4 tests. With the old messages put back in `replaySkip`, the two tests on the reason fail, and with versions compared as text, three tests fail. On this host, `CS_VCR_AGENTS=1 go test ./test/agents -run TestReplayFixtures` skips five fixtures, and each reason says the host's claude or codex is newer than the one it was recorded with. Each of those reasons ends with `[recorded 2.1.245, host 2.1.280]` or `[recorded 0.149.1, host 0.152.1]`, and the three opencode fixtures replay and pass. With claude taken off the PATH, `claude-code-api-key` skips because `claude is not installed on this host`, ending with `[recorded 2.1.245, host none]`. Under `CS_VCR_AGENTS_STRICT=1` the same scenario fails instead. `make ci` passed at 078ec20, and its live tier reported the same skips and passes."},"resolution":"A replay skip now names its case, absent, newer or older, in words that do not change when an agent updates. Both versions come last in brackets, where a comparison between two runs can set them aside. The Makefile, the package doc and SPEC describe it. The cassettes still hold claude 2.1.245 and codex 0.149.1, and when to re-record them is a separate decision.","details":"**What happens.** When a host's agent is not the version a fixture was recorded with, `make test-integration` skips the scenario with a reason that quotes the host's version: `claude-code-api-key was recorded with claude 2.1.245 and this host has 2.1.258`. The reason does not say whether the host's agent is newer or older than the recording. The Makefile's comment on `ci` says only that an agent the host does not carry is skipped with its reason.\n\n**Seen in the campaign.** On the pilot's host, `claude` and `codex` were installed and newer than the recordings, so five scenarios skipped on the version, not on a missing agent. The qa seat recorded those five reasons as the baseline every later `make ci` was compared against. The next day the host's `claude` was 2.1.280, so the same skip carried a different reason.\n\n**Why it matters.** A campaign compares a gate's skips before and after a change. A reason that moves with every agent update reads as a changed skip, although nothing in the repository changed.\n\n**What would help.** Say in fixed words whether the agent is absent, newer or older than the recording. Print both versions in one stable place that a comparison can set aside, and correct the Makefile comment.","notes":[],"links":[]},{"id":"VCR-036","title":"make repin pins a sibling's tip whether or not its CI passed","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"If I wanted make repin to look for the last green built commit, could this just work with curl?\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"last-green-pins","evidence":{"commits":["b0164bc","f623a5d","a11d701"],"integrated":[],"verified":"`make repin` in a clean clone of main at a11d701 pinned each codesweep-ai tool at the first commit in its project's `built` list. The pin on lint went to its last build, though lint's main had since moved on to commits that changed only the ledger."},"resolution":"`make repin` pins each codesweep-ai tool to the first commit in the `built` list of that project's status file. A tool whose project lists no build keeps its pin rather than moving to the tip.","details":"`make repin` moves every codesweep-ai tool pin to its sibling's main with `go get …@main`. The tip of main may be a commit whose CI failed, one still building, or one that changed only the ledger and was never built. The status file each project publishes now names the newest commit its CI built and passed, as `built`. `make repin` pins that commit, and falls back to the tip where the file names none.","notes":[{"date":"2026-09-23","text":"`make repin` now reads `built` as the list the status file holds, and keeps a pin whose project lists no build. Moving it to the tip would pin a commit that may not have built."}],"links":[]},{"id":"VCR-037","title":"A push that changes only the ledger runs the whole of ci","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"support ledger builds on pushes that only contain ledger changes, with just linting, ledger checking, and a pages build to publish the ledger page\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"ledger-builds","evidence":{"commits":["85772b3"],"integrated":[],"verified":"Pushing 988d9cd, which changed only `ledger/`, started the ledger and pages workflows and no ci. Both passed, and the status file still lists a11d701 first in `built`."},"resolution":"ci skips a push that changes only `ledger/`. The ledger workflow runs the ledger check and the document linters, and pages republishes the ledger's page. Nothing is built or published, so `built` stays.","details":"Closing an issue is a commit that changes only `ledger/`, and pushing it runs the whole of `ci`. Nothing `ci` builds or tests has changed but the records. Such a push needs only the ledger check, the document linters and a site build, which publishes the ledger's page.","notes":[],"links":[]},{"id":"VCR-038","title":"A replay that refuses every request still exits 0, so a CI step trusting the exit status passes a replay that served nothing","type":"defect","severity":"med","status":"open","foundBy":"session agent, while building a replayed test of the campaign viewer's agent Q&A on this host","opened":"2026-09-24","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"A `cs-vcr replay` that has refused every request it received still ends with exit status 0. R33 in SPEC.md requires exit 4 only for a miss, and a request refused as `unknown_cassette` or `cassette_unusable` is not counted as one.\n\nReproduced at `41c67be`: start `cs-vcr replay` on an empty store, POST once to `/c/anthropic/nosuch/v1/messages`, and stop it. The summary reads `requests 1`, `replayed 0`, `misses 0`, `unknown cassette 1`, `rejected 1`, and the exit status is 0.\n\nA real test ran into the same thing. A cs-vcr built on 2026-09-10 refused two cassettes recorded at ruleset v14, each request answered \"recorded by a different build\", and it exited 0. A script that gated on the exit status reported a pass. The script now reads the summary and fails on `rejected` above 0 or `replayed` of 0.\n\nThe manual says replay exits 4 \"if any request had no recording\", which a reader takes to include these. Either the exit status or R33 and the manual should say what a refused request means for a replay.","notes":[],"links":["VCR-011"]},{"id":"VCR-039","title":"scrub reads the n of an escaped newline as the start of an email address, and --force then writes invalid JSON","type":"defect","severity":"med","status":"open","foundBy":"session agent, while scrubbing a Claude Code cassette recorded against a site whose CLAUDE.md holds `@AGENTS.md`","opened":"2026-09-24","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"The email pattern in `internal/cassette/scrub.go` runs over the file's raw bytes, where a newline is the two characters `\\n`. Claude Code puts the text `\\n\\n@AGENTS.md` in its prompt when a project's `CLAUDE.md` imports `AGENTS.md`, and scrub reports `n@AGENTS.md` as an email address, since `md` passes as a top-level domain.\n\nThis was reproduced at `41c67be` on a Claude Code cassette of four requests. `cassette scrub` finds one email in each. With the escaped newline replaced by a space, it finds none.\n\nWith `--force` it replaces `n@AGENTS.md` with `\u003cEMAIL>` and leaves the backslash, so each request holds `\\\u003cEMAIL>`. That is an invalid JSON escape, and Python's `json.load` refuses the file. scrub still exits 0. A real address after any escape, such as `\\n` or `\\t`, would be cut and corrupted the same way.\n\nMatching on the decoded strings would avoid both. Until then, `--allow-email @AGENTS.md` lets the import through.","notes":[],"links":[]},{"id":"VCR-040","title":"A passing make ci leaves no build a sibling can pin","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"it doesn't seem possible anymore to have make repin do pin on local builds, which haven't been published to ghcr.io or npmjs.com or built in the Github CI builds\"","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["1e1ea5e"],"integrated":[],"verified":"`make ci` at 0763753 ended `record-build: recorded vcr 0763753 as a local build in ~/.local/share/cs-builds/codesweep-ai (go v0.0.0-20260926051938-07637535da0d)`. dashboards' tests/test_record_build.py passes all 15 of its tests against this same scripts/record-build.sh, byte for byte. GitHub CI's `ci` passed on 0763753."},"resolution":"A clean, passing `make ci` now records its commit in the owner's build store, `~/.local/share/cs-builds/\u003cowner>/`. It keeps the Go module in the module proxy's layout, the npm packages where the project has them, and an entry naming the versions. A run over uncommitted changes records nothing, and says so.","details":"`make ci` runs every gate CI runs, on this machine, and leaves nothing another project can pin. Pins move only to commits GitHub CI lists as built. So a change across several projects has to be pushed and built one project at a time before the next can pin it. A clean passing run could record its commit as a local build instead: the module zip Go resolves it from, and an entry naming its versions. They would go in a store the sibling projects read. Go and npm builds of a clean commit are byte-identical to CI's. A pin on such a build is therefore the pin CI writes once that commit is pushed.","notes":[],"links":[]},{"id":"VCR-041","title":"make repin cannot pin a sibling's local build","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"it doesn't seem possible anymore to have make repin do pin on local builds, which haven't been published to ghcr.io or npmjs.com or built in the Github CI builds\"","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["1e1ea5e"],"integrated":[],"verified":"dashboards' tests/test_repin_go.py passes all 7 of its tests against this same scripts/repin-go.sh. They pin and name a newer local build, and take CI's under `LOCAL=0`, when CI's is newer, and on a tie. They hold a build awaiting images, and skip one whose commit left the branch. In a scratch workspace, campaign's copy left out sandbox's newest local build once the sandbox checkout beside it held that commit on no branch. It said so, and took the build CI had made. GitHub CI's `ci` passed on 0763753."},"resolution":"`make repin` now moves each cs- pin to the newer, by commit time, of the sibling's last CI build and its newest local build. It names each pin taken from a local build, and resolves those through the store's module proxy ahead of the usual one. `make repin LOCAL=0` takes CI builds only, and no module is fetched with `GOPROXY=direct` any more.","details":"`make repin` moves each codesweep-ai tool pin to the first commit in `built` of its project's status file, and to nothing else. A build that a clean `make ci` recorded in the build store is invisible to it. So a change made across several projects cannot pin its own parts before they are pushed. Every module is also fetched with `GOPROXY=direct`. On a cold cache that reaches every module's source host, and it hung for over seven minutes where one did not answer.","notes":[],"links":[]},{"id":"VCR-042","title":"Stripping the userEmail section leaves an empty reminder, which a run without an address never sends","type":"defect","severity":"med","status":"closed","foundBy":"session agent, replaying sandbox and campaign cassettes recorded on Claude Code 2.1.283","opened":"2026-09-26","resolved":"2026-09-26","stint":"agent-cli-bump","evidence":{"commits":["4b0cad9"],"integrated":[],"verified":"`go test ./internal/config/ ./internal/cassette/ -count=1` passes on 7bfe30d, TestDefaultNormalizesAnAccountBlockThatComesAndGoes, TestAnItemACutEmptiesGoesWithIt and TestAnItemTheCutDidNotEmptyStays among it. GitHub CI's `ci` passed on 7bfe30d. Campaign pinned to that build ran `make ci` on 2026-09-26. Its claude-subscription replay, recorded with a real account and replayed with a fabricated one, served 49 requests with 0 misses. Sandbox's `make ci` on that build replayed its 14 agent cassettes, the lent Claude login among them, with none failing."},"resolution":"Ruleset v15 adds a `remove` rule. It cuts a passage from the decoded text of every string before hashing, and removes an item the cut leaves empty. The address section moved from `replace` into it, beside a pattern for the reminder that section can leave empty. A run with an address and a run without one now normalize alike, so a consumer needs no fabricated account.","details":"Claude Code writes the signed-in account's address into a system reminder at the head of the first user message. In 2.1.283 that reminder holds only the `# userEmail` section, because `# claudeMd` and `# currentDate` moved out of it. The normalize rule in `internal/config/config.go` strips the section and keeps the reminder around it.\n\nA run whose client knows the address therefore normalizes to an empty reminder. A run whose client does not know it sends no reminder at all. The rule exists so that present and absent normalize alike, and they no longer do. The replay then fails to match the request, and reports `messages[0].content: 4 items vs 3`.\n\nTwo consumers hit this on the same day, each recording with a real account and replaying with a fabricated one. They were sandbox's lent Claude login replay (SBX-086) and campaign's claude-subscription scenario (SAC-080). Each worked around it by giving its replay host a fabricated account.\n\nDropping the reminder when stripping leaves it empty would make the two cases normalize alike. The consumers would then need no fabricated account for this.","notes":[{"date":"2026-09-26","text":"The fix is a new `remove` rule, cut from the decoded text of every string before hashing. An item that a cut empties is removed with it. The address section moved into it, beside a pattern for the reminder that section can leave empty. The same rule answers the two reminders in VCR-043."}],"links":[]},{"id":"VCR-043","title":"Claude Code's working-directory and background-task reminders make a replay miss when the machine behaves differently","type":"defect","severity":"high","status":"closed","foundBy":"session agent, replaying campaign cassettes recorded on Claude Code 2.1.283","opened":"2026-09-26","resolved":"2026-09-26","stint":"agent-cli-bump","evidence":{"commits":["4b0cad9","7bfe30d"],"integrated":[],"verified":"`go test ./internal/config/ ./internal/cassette/ -count=1` passes on 7bfe30d, TestDefaultCutsWhatTheMachineMadeClaudeCodeSay and TestAVolatileFieldOnOneSideOnlyIsTolerated among it. GitHub CI's `ci` passed on 7bfe30d. Campaign pinned to that build ran `make ci` on 2026-09-26. Its claude-api-key, claude-subscription and claude-fault-capacity replays served 54, 49 and 52 requests with 0 misses, where each had missed at the same step on every run."},"resolution":"The same `remove` rule cuts the `# Environment update` reminder and the `[SYSTEM NOTIFICATION - NOT USER INPUT]` item, on both sides of a replay. Alignment tolerates a volatile field present on one side only, as SPEC.md R10 requires, which is how Claude Code writes `is_error`. The proxy reads a recording with no `is_error` as a command that succeeded, so one that failed only on replay is still counted.","details":"Claude Code 2.1.283 adds two reminders because of what happened on the machine, and a replay reproduces neither by design. After a command that changed directory and succeeded, it adds `# Environment update` with the new working directory. After a command outlived its timeout and moved to the background, it adds a `[SYSTEM NOTIFICATION - NOT USER INPUT]` item once the command finishes.\n\nA replayed command runs for real. In campaign's replay, a command named a commit that only the recording's checkout had, so it failed and the shell stayed where it was. A command that timed out while recording finished in time while replaying. Either way the replay's request lacks the reminder, and the step misses on every run. Three of campaign's nine scenarios failed this way, at steps 16, 19 and 29.\n\nClaude Code can turn both off, with `CLAUDE_BASH_MAINTAIN_PROJECT_WORKING_DIR=1` and `CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1`. Each changes what the agent can do, since a `cd` no longer persists and a long command is killed rather than backgrounded. Turning them off would record an agent unlike the one campaigns run.","notes":[{"date":"2026-09-26","text":"With both reminders cut, two orchestrators still missed on replay, at `is_error: only in the live request`. Claude Code 2.1.283 writes that flag only when a command failed, so a replayed command that failed differs by the field's presence. The path was already volatile, but alignment reported a field on one side only as a shape difference before consulting the rules. It now tolerates one, as R10 requires."}],"links":["VCR-042"]},{"id":"VCR-044","title":"Codex 0.156 and later cannot start on a ChatGPT login behind cs-vcr, because its workspace discovery goes to a host cs-vcr refuses","type":"defect","severity":"high","status":"closed","foundBy":"session agent, moving sandbox's agent fixtures past Codex 0.155.1 (sandbox SBX-084)","opened":"2026-09-26","resolved":"2026-09-26","stint":"codex-discovery","evidence":{"commits":["21f4c2e"],"integrated":[],"verified":"`go test ./internal/proxy/ -count=1` passes on 21f4c2e. Its new tests cover the discovery answered while recording and while replaying, the rest of the backend refused, a discovery with no account refused, and a prefixed call left alone. `make ci` passed on 21f4c2e. In a Firecracker sandbox holding the host's real Codex login, Codex 0.157.1 ran a real turn through this build in record mode, and answered pong. The session summary read 4 recorded, 1 backend call answered and 36 refused. The same turn replayed from that cassette with no provider reachable: 3 replayed, 0 misses, 0 upstream calls, and the discovery answered again. Sandbox's `make ci`, pinned to this build and rebuilt with its new wrapper, replayed all 14 of its agent cassettes, codex-login-shared among them."},"resolution":"cs-vcr answers `/backend-api/wham/accounts/check` itself, recording and replaying alike, with the account the request named and `https://chatgpt.com` as its origin (R33a). It refuses every other call under `/backend-api`, and records none of them. A client reaches that route by a second name for the listener. Sandbox's agent matrix now gives its shared Codex login that name as `chatgpt_base_url`, which is a separate origin from its model base URL.","details":"Codex 0.156 and later make a workspace routing discovery before their TUI starts on a ChatGPT login: `GET {chatgpt_base_url}/wham/accounts/check`, with the token they hold. The TUI exits when it fails, with `account/read failed during TUI bootstrap: workspace routing discovery failed`.\n\nBehind cs-vcr the call cannot succeed. `chatgpt_base_url` defaults to chatgpt.com, which arrives as a `CONNECT` that R32 refuses. Let through, it would succeed for a real login and fail for a fabricated one, so a recording could not be replayed. Pointing `chatgpt_base_url` at cs-vcr does not help by itself. For an account with no residency rule the answer is `NO_CONSTRAINT`, which Codex resolves to the origin of `chatgpt_base_url` and requires to be HTTPS.\n\nSandbox's agent matrix records its codex-login-shared case exactly this way, so that case cannot be recorded or replayed on any Codex past 0.155.1.","notes":[],"links":[]},{"id":"VCR-045","title":"The build store keeps every npm package it is given, which slows every install through it","type":"defect","severity":"low","status":"closed","foundBy":"session agent, investigating campaign's failed `make repin` of 2026-09-29","opened":"2026-09-29","resolved":"2026-09-29","stint":"2026-09-29 npm build store","evidence":{"commits":["51a6ee2"],"integrated":[],"verified":"dashboards' tests/test_record_build.py passes 18 of 18 against this record-build.sh, byte for byte, and its prune test fails against the previous copy. Run over a copy of the owner's store, the prune took npm/ from 179 packages (311 MB) to 47 (83 MB), keeping each project's three newest."},"resolution":"Each recorded build removes the npm packages of older ones. A project keeps them for its three newest builds recorded within three days, and for its newest whatever its age. Entries, modules and images stay, and a store that is a repository, as a campaign's is, is left whole.","details":"Nothing removed npm packages from the owner's build store. Each clean `make ci` in lint, ledger or npmrevs adds five there, and `npm run ci` in ui adds one. The cs-npmrevs registry reads every package it serves before it answers, and `scripts/with-npmrevs.sh` serves the store, so each build made every later install through it wait longer. By 2026-09-29 the store held 179 packages (311 MB), the registry took about 9 seconds to start, and campaign's `make repin` failed waiting for it. This project records no npm package, but it carries the same script, so a build recorded here is a moment the store can be pruned.","notes":[],"links":[]},{"id":"VCR-046","title":"The agent suite, CI and the config command still assume OpenCode 1","type":"improvement","severity":"med","status":"closed","foundBy":"user request (host): \"Continue the opencode 2.0 port.\"","opened":"2026-11-01","resolved":"2026-11-01","stint":"opencode-v2.x","evidence":{"commits":["b6ebc5c","17e9852","1ce87b1"],"integrated":[],"verified":"`make ci` passed on 1ce87b1's tree, with OpenCode 2.2.5 on the host. `make test-smoke` passed all four committed cassettes, opencode-fireworks among them. `CS_VCR_AGENTS=1 CS_VCR_AGENTS_STRICT=1 go test ./test/agents -run 'TestReplayFixtures/opencode-fireworks$' -count=1` passed, as CI runs it. The re-recording on 2.2.5 reported the cassette clean of host identity."},"resolution":"The suite runs OpenCode 2 with `--standalone` and points it at cs-vcr through `providers.\u003cid>.settings.baseURL` in `opencode.json`. CI runs the v2 installer to get it. `cs-vcr config opencode` prints that block, or the same JSON in `OPENCODE_CONFIG_CONTENT`, and no base-URL variable. opencode-fireworks is re-recorded on 2.2.5. The port lives on the opencode-v2.x branch, and main stays on OpenCode 1.19.5.","details":"OpenCode 2 changes three things cs-vcr relies on. It reads no base-URL variable for any provider, so `ANTHROPIC_BASE_URL` and `OPENAI_BASE_URL` no longer point it at cs-vcr. Its config file keys a provider's base URL as `providers.\u003cid>.settings.baseURL` rather than `provider.\u003cid>.options.baseURL`. And `opencode run` reaches a background service that keeps the environment it was started with. The proxy, key and base URL a run sets reach it only when the run takes `--standalone`.\n\nThe agent suite, CI's installer, `cs-vcr config opencode`, README and MANUAL all assumed OpenCode 1. The committed opencode-fireworks cassette was recorded on 1.19.5, so no OpenCode 2 host could replay it.","notes":[],"links":[]}],"drafts":[],"queue":{"recommendedBy":"session agent, after closing VCR-025 through VCR-028","updated":"2026-09-20","items":[{"id":"VCR-006","why":"The first install route a new reader takes still leads to an empty page."},{"id":"VCR-013","why":"A one-line hint sends a re-recording contributor after the wrong cause."}]},"description":"cs-vcr records the traffic between an AI coding agent and its LLM provider into committed, diffable cassettes, and replays it with no provider reachable. A build runs the whole agent loop for $0, and no API key need enter a sandbox. This ledger tracks its defects, improvements and ideas.","links":[],"commitUrlTemplate":"https://github.com/codesweep-ai/vcr/commit/{sha}","rendererVersion":"0.7.5","uiVersion":"0.3.1-dev.20261029181327.893b2b0","lastActivity":"2026-11-01","derived":{"terminalStatuses":["closed","wont-fix","moved-to-roadmap"],"lastActivity":{"VCR-001":"2026-08-17","VCR-002":"2026-08-17","VCR-003":"2026-08-17","VCR-004":"2026-08-17","VCR-005":"2026-08-17","VCR-006":"2026-08-17","VCR-007":"2026-08-17","VCR-008":"2026-08-20","VCR-009":"2026-08-20","VCR-010":"2026-08-20","VCR-011":"2026-08-20","VCR-012":"2026-08-20","VCR-013":"2026-08-20","VCR-014":"2026-09-09","VCR-015":"2026-08-25","VCR-016":"2026-08-27","VCR-017":"2026-08-28","VCR-018":"2026-08-28","VCR-019":"2026-08-28","VCR-020":"2026-08-28","VCR-021":"2026-09-01","VCR-022":"2026-09-01","VCR-023":"2026-09-09","VCR-024":"2026-09-21","VCR-025":"2026-09-20","VCR-026":"2026-09-20","V
